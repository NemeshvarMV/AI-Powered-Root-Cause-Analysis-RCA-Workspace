<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Gradient Definition: Professional Technical Sapphire & Deep Ocean Blue (Zero Purple) -->
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Outer Protective Shield / Emblem Container -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#shield-grad)" stroke="#0284c7" stroke-width="2.5" />

  <!-- Root Cause Analysis & Quality Node Graph Geometry -->
  <!-- Center Root Node -->
  <circle cx="32" cy="24" r="5.5" fill="#38bdf8" />

  <!-- Branched Ishikawa / 5-Whys Diagnostic Nodes -->
  <circle cx="20" cy="38" r="4.5" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="44" cy="38" r="4.5" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="32" cy="48" r="4" fill="#10b981" />

  <!-- Connection Linkages -->
  <path d="M32 24 L20 38" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
  <path d="M32 24 L44 38" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
  <path d="M20 38 L32 48" stroke="#10b981" stroke-width="2" stroke-dasharray="2 2" stroke-linecap="round" />
  <path d="M44 38 L32 48" stroke="#10b981" stroke-width="2" stroke-dasharray="2 2" stroke-linecap="round" />
